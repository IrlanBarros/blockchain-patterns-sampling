[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web3blockset-sampling"
version = "1.2.1"
description = "Reproducible stratified sampling of the Web3BlockSet research corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
web3blockset-sampling = "web3blockset_sampling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
web3blockset_sampling = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
